name: Build & release

# Every push to main: run the simulation tests, build a signed release APK and publish it as a
# GitHub release tagged build-<versionCode>. The game checks that release feed and updates itself.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key secret yet - run tools/setup-signing.ps1 once. Building with a throwaway debug key; no release is published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests (core simulation)
        run: ./gradlew :core:test --stacktrace

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        run: |
          CODE=$(git rev-list --count HEAD)
          BASE=$(grep '^base=' version.properties | cut -d= -f2 | tr -d '\r')
          NAME="$BASE.$CODE"
          cp app/build/outputs/apk/release/app-release.apk "AgesOfSiege-$NAME.apk"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AgesOfSiege-${{ steps.apk.outputs.name }}
          path: AgesOfSiege-*.apk

      - name: Publish release (in-app update feed)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "build-${{ steps.apk.outputs.code }}" > /dev/null 2>&1; then
            echo "Release build-${{ steps.apk.outputs.code }} already exists - skipping."
            exit 0
          fi
          git log -1 --pretty=%B > notes.md
          gh release create "build-${{ steps.apk.outputs.code }}" "AgesOfSiege-${{ steps.apk.outputs.name }}.apk" \
            --title "Ages of Siege ${{ steps.apk.outputs.name }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
